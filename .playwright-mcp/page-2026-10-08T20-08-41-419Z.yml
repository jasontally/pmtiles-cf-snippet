      - listitem [ref=e10]:
        - generic [ref=e11]: No rate limit
        - text: No throttling, no quota, no burst cap.
      - listitem [ref=e12]:
        - generic [ref=e13]: No SLA
        - text: Best effort only. See what that means below.
      - listitem [ref=e14]:
        - generic [ref=e15]: Zoom 0 to 15
        - text: Vector tiles, gzip, 118 GiB of archive.
