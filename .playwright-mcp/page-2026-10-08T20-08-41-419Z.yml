  - generic [ref=e32]:
    - heading "Use it" [level=2] [ref=e33]
    - paragraph [ref=e34]: The archive speaks HTTP range requests, so every PMTiles client can read it.
    - heading "One. Put a map on the page" [level=3] [ref=e35]
    - paragraph [ref=e36]: "Copy this file. It is the whole example: two script tags, one style URL, one map."
    - code [ref=e38]: "<!doctype html> <html> <head> <meta charset=\"utf-8\"> <meta name=\"viewport\" content=\"width=device-width, initial-scale=1\"> <title>Basemap</title> <link rel=\"stylesheet\" href=\"https://cdn.jsdelivr.net/npm/maplibre-gl@5/dist/maplibre-gl.css\"> <script src=\"https://cdn.jsdelivr.net/npm/maplibre-gl@5/dist/maplibre-gl.js\"></script> <script src=\"https://cdn.jsdelivr.net/npm/pmtiles@3/dist/pmtiles.js\"></script> <style>html, body, #map { margin: 0; height: 100%; }</style> </head> <body> <div id=\"map\"></div> <script> // Teach MapLibre how to read a PMTiles archive. const protocol = new pmtiles.Protocol(); maplibregl.addProtocol(\"pmtiles\", protocol.tile); new maplibregl.Map({ container: \"map\", style: \"https://tiles.jasontally.com/styles/light.json\", center: [2.35, 48.85], // Paris zoom: 4 }); </script> </body> </html>"
    - heading "Two. Swap the tiles in a style you already have" [level=3] [ref=e39]
    - paragraph [ref=e40]:
      - text: Every MapLibre style reads its tiles from a source. To use these tiles, change that one
      - code [ref=e41]: url
      - text: . Nothing else in the style changes.
    - code [ref=e43]: "\"sources\": { \"protomaps\": { \"type\": \"vector\", - \"url\": \"pmtiles://https://demo-bucket.protomaps.com/v4.pmtiles\", + \"url\": \"pmtiles://https://tiles.jasontally.com/basemap.pmtiles\", \"attribution\": \"<a href=\\\"https://www.openstreetmap.org/copyright\\\">&copy; OpenStreetMap contributors</a>\" } }"
    - paragraph [ref=e44]: "Or do it in code, which is useful if the style comes from a server you do not control:"
    - code [ref=e46]: "// Rewrite every PMTiles source in a style to point at these tiles. const style = await (await fetch(\"https://your-server/style.json\")).json(); for (const source of Object.values(style.sources)) { if (source.url?.startsWith(\"pmtiles://\")) { source.url = \"pmtiles://https://tiles.jasontally.com/basemap.pmtiles\"; } } new maplibregl.Map({ container: \"map\", style, center: [2.35, 48.85], zoom: 4 });"
    - paragraph [ref=e47]:
      - strong [ref=e48]: One thing to check before you swap.
      - text: This archive is
      - strong [ref=e49]: Protomaps schema v3
      - text: . A style written for a different schema will load and then draw nothing, because the source layer names do not match. The nine layer names are listed below, and so is a ready-made v3 style you can copy from.
    - heading "Three. About Leaflet" [level=3] [ref=e50]
    - paragraph [ref=e51]:
      - text: These are
      - strong [ref=e52]: vector
      - text: tiles. Leaflet draws raster tiles, and the PMTiles library will refuse this archive in Leaflet with
      - code [ref=e53]: archive contains MVT vector tiles, but leafletRasterLayer is for displaying raster tiles
      - text: . That is the library being correct, not a bug. Use MapLibre GL as above. If you need Leaflet or a raster image pipeline, you need a raster-rendered archive, which this is not.
    - heading "Four. Read the archive with the PMTiles library" [level=3] [ref=e54]
    - paragraph [ref=e55]: No map, just data. Useful for scripts, tests and anything that is not a picture.
    - code [ref=e57]: "import { PMTiles, FetchSource } from \"pmtiles\"; const archive = new PMTiles(new FetchSource(\"https://tiles.jasontally.com/basemap.pmtiles\")); const header = await archive.getHeader(); console.log(header.minZoom, header.maxZoom); // 0 15 console.log(header.numAddressedTiles); // 1431655765 const metadata = await archive.getMetadata(); console.log(metadata.name); // \"Protomaps Basemap\" const tile = await archive.getZxy(3, 4, 2); // z, x, y console.log(tile.data.byteLength);"
    - paragraph [ref=e58]:
      - text: Note the two classes.
      - code [ref=e59]: FetchSource
      - text: is the byte reader over HTTP, and
      - code [ref=e60]: PMTiles
      - text: is the reader that sits on top of it and understands the format.
      - code [ref=e61]: FileSource
      - text: is the local-file equivalent of
      - code [ref=e62]: FetchSource
      - text: ; given a URL string it will not work.
    - paragraph [ref=e63]: The archive is a fixed snapshot and is not being refreshed. If you need current OpenStreetMap data, use a source that publishes updates.
