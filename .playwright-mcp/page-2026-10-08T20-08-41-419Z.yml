    - heading "Protomaps Basemap tiles" [level=1] [ref=e4]
    - paragraph [ref=e5]: The whole Protomaps Basemap, zoom 0 to 15, served as one PMTiles archive over plain HTTP. Point any PMTiles client at the URL and it works. There is no API key, no account, and no rate limit.
    - code [ref=e6]: https://tiles.jasontally.com/basemap.pmtiles
    - list [ref=e7]:
      - listitem [ref=e8]:
        - generic [ref=e9]: No API key
