  - generic [ref=e123]:
    - heading "What this is not" [level=2] [ref=e124]
    - paragraph [ref=e125]: Plain answers, so nothing here surprises you later.
    - list [ref=e126]:
      - listitem [ref=e127]:
        - strong [ref=e128]: There is no service level guarantee.
        - text: This is a free service with no contract behind it. It can be slow, it can go down, and the URL and the data can change or disappear without notice. If your product depends on it, host your own copy of the tiles or buy a supported plan from someone.
      - listitem [ref=e129]:
        - strong [ref=e130]: The data is not being refreshed.
        - text: The archive is a snapshot of the Protomaps Basemap. New OpenStreetMap edits do not appear in it.
      - listitem [ref=e131]:
        - strong [ref=e132]: No whole-file download.
        - text: Requests are answered in ranges of at most 512 KiB, which is all a PMTiles client ever asks for. Asking for the whole 118 GiB in one request returns
        - code [ref=e133]: "416"
        - text: ", which is correct."
      - listitem [ref=e134]:
        - strong [ref=e135]: Attribution is required.
        - text: The tiles are derived from OpenStreetMap. Keep the attribution line in your style or on your map.
